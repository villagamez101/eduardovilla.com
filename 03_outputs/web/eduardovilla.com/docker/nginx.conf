server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # PDF de recursos con la caché correcta
    location /recursos/ { try_files $uri =404; }
    add_header X-Content-Type-Options nosniff always;

    # Específicos antes del clean-urls general
    location = /robots.txt { try_files $uri =404; }

    # /ruta → /ruta/index.html (URLs limpias de Astro)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # 404 custom
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/pdf;
    gzip_min_length 512;

    location ~* \.(woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|jpe?g|webp|avif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
